readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.6.0",
    "notion-client>=3.1.0",
    "pydantic>=2.0.0",
]

[project.scripts]
notion-mcp = "notion_mcp.server:main"